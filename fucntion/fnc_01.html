<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수</title>
  </head>
  <body>
    <script>
      // 함수 : 동작해야 할 기능을 묶은 명령
      // alert() : 자바스크립트에 포함되어 있는 여러 함수 중 하나이다 => 내장함수
      // 내가 만드는 함수
      // 두 수를 더하는 함수
      // ( 매개 변수 ) : 함수가 값을 전달하는 변수  
    function addNum( a , b , c , d ) {
        console.log("함수 호출");
        console.log(a);
        
        // 실행 코드
        let sum = a + b + c + d ;
        document.write(`${sum} <br> ` )  ;
    }
    addNum(1, 10, 50, 20 ) ; // 인수 : 함수 호출 할 때 전달하는 실제 값 
    addNum(2, 20, 10, 20 ) ; 
    addNum(3, 50, 30, 10 ) ; 
    addNum() ; // undefined 
    </script>
  </body>
</html>
