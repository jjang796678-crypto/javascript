<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> 함수 6 </title>
  </head>
  <body>
    <!-- button#menuBtn${메뉴$} -->
    <button id="menuBtn1">메뉴1</button>
    <button id="menuBtn2">메뉴2</button>
    <button id="menuBtn3">메뉴3</button>
    <div class="all"> 
      <div id="menu1" style="display: none;">메뉴 내용 1</div>
      <div id="menu2" style="display: none;">메뉴 내용 2</div>
      <div id="menu3" style="display: none;">메뉴 내용 3</div>
    </div>
    <script>
      // 메뉴 보이게 하는 함수 
      function toggleMenu(id) { 
        console.log(id);
        let menu = document.getElementById(id) ; 
        console.log(menu);
        document.querySelectorAll(".all>div").forEach(El => {
          El.style.display = "none" ; 
        }) ;
        if(menu.style.display === "none") { 
          menu.style.display = "block"; 
        } else { 
          menu.style.display = "none" ; 
        }
      }
      const menuBtn1 = document.getElementById("menuBtn1") ; 
      const menuBtn2 = document.getElementById("menuBtn2") ; 
      const menuBtn3 = document.getElementById("menuBtn3") ; 
      menuBtn1.addEventListener("click" , () => { 
        toggleMenu("menu1") ; 
      }) ; 
      menuBtn2.addEventListener("click" , () => { 
        toggleMenu("menu2") ; 
      }) ; 
      menuBtn3.addEventListener("click" , () => { 
        toggleMenu("menu3") ; 
      }) ; 
    </script>
  </body>
</html>
