<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 자바 스크립트 첫 수업 </title>
</head>
<body>
    <!-- 자바스크립트 첫 수업 -->
    <script> 
        // 자바스크립트는 식과 문으로 구성
        // 식 : 값을 만들어내는 코드 / 표현식 (연산식뿐만 아니라 실제값도, 함수를 실행하는 것도 모두 식이다)
        const inch = 2 ; 
        console.log(inch);
        "안녕하세요" ; // 문자열 = 표현식 
        1+2 // 숫자 = 연산식  = 표현식 
        // 문 :넓은 의미로 값이나 식까지 포함한다. 
        // 조건문, 제어문 등을 예로 사용 
        // 알림창 출력 
        // alert("여러분 안녕하세요")
        // confirm("여러분 지금 자바스크립트 수업 중입니다.")
        // 입력창 
        // prompt("생년월일" , "yyyy-mm-dd")
        // 변수
        const name = "장영우" ; 
        const age = "20" ; 
        const phone = "galaxy a9 pro"
        // 화면 출력 
        document.write("장영우") ; 
        document.write(`<h1> ${name} </h1> <p> 나이는 ${age} </p> <p> 핸드폰 기종은 ${phone} </p>`) ; 
        

    </script>
</body>
</html>
