<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background-color: #f5f5f5;
      }
      h1 {
        text-align: center;
        margin-top: 50px;
      }
      .container {
        max-width: 1200px;
        margin: 100px auto;
        background-color: #fff;
        padding: 20px;
      }
      .student-list {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      }
      .student-list img {
        width: 100%;
        display: block;
      }
      .card-content {
        padding: 15px;
      }
      /* 모달창 */
      .modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: rgba(0, 0, 0, 0.7);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .modal-content {
        position: relative;
        width: 500px;
        background-color: #fff;
        padding: 30px;
        border-radius: 10px;
      }
    </style>
  </head>
  <body>
    <h1>학생 정보 관리</h1>
    <div class="container">
      <div id="studentList" class="student-list">
        <!-- js출력 -->
      </div>
    </div>
    <!-- 모달창 -->
    <div class="modal" id="modal">
      <div class="modal-content">
        <div class="close">&times;</div>
        <!-- 학생 상세내용 -->
        <div id="detail">
          <!-- js출력 -->
        </div>
      </div>
    </div>
    <script>
      const studentList = document.querySelector("#studentList");
      fetch("data/students.json")
        .then((res) => {
          //   console.log(res);
          return res.json();
        })
        .then((data) => {
          // console.log(data);
          studentList.innerHTML = data
            .map((student) => {
              // console.log(student);

              return `
<div class="card">
          <img src="${student.image}" alt="${student.name}" />
          <div class="card-content">
            <h3>이름:${student.name}</h3>
            <p>${student.major}</p>
          </div>
        </div>
`;
            })
            .join("");
        })
        .catch((error) => {
          console.log(error);
        });
    </script>
  </body>
</html>
