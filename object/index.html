<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 객체 </title>
</head>
<body>
    <!-- 객체 -여러가지 정보를 하나로 묶어 놓은것 -->
    <!-- 내장 객체 - 자바스크립트가 미리 만들어 놓은 객체  -->
    <!-- Date 날짜 , Array 정보들의 묶음 , String 글자 수 , Math 계산 결과값 반올림  -->
    <script> 
        // 1. String 
        const str = "Hello world" ; 
        console.log(str);
        // console.log(str.속성) 
        console.log(str.length); // length : 문자의 길이를 알 수 있는 속성 
        console.log(str.toUpperCase()); // 대문자로 변경하는 메서드  
        console.log(str.includes("world")); // 해당하는 내용이 있는지 메서드   
        // 2. Array
        const arr = [1, 2, 3, 4];
        console.log(arr);
        console.log(arr.length);
        console.log(arr.push(5));
        console.log(arr);
        console.log(arr.join("7"));
        // 3. Date 
        const today = new Date() ; 
        console.log(today);
        console.log(today.getMonth() + 1 ); // 현재 날짜 (월 0 부터 출력하기 때문에 +1 ) 
        console.log(today.toDateString() ); 
        console.log(today.toLocaleDateString() ); 
        console.log(today.getFullYear() );
        // 4. Math
        console.log(Math.PI); // 원주율 
        console.log(Math.max(10, 23, 100, 50));
        console.log(Math.min(10, 23, 100, 50));
        console.log(Math.random()); // 0~1 사이의 난수 (0, 1 제외)
        
        
    </script>
</body>
</html>
