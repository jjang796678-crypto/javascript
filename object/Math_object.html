<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>  Math 객체 </title>
</head>
<body>
    <script> 
        let num = 2.223;
        let maxNum = Math.max(10, 5, 8, 30) ; 
        // console.log(maxNum);
        let minNum = Math.min(10, 5, 8, 30) ; 
        console.log(minNum);
        // round() : 소수점 첫째자리에서 반올림 
        console.log(Math.num);
        // floor() : 소수점을 버리고 내림 ( 정수로 변환 ) 
        let floorNum = Math.floor(num) ;
        console.log(floorNum);
        // ceil() : 소수점을 올림하여 정수로 변환 
        let ceilNum = Math.ceil(num) ; 
        console.log(ceilNum); // 2.223 => 3
        // random() : 0 초과 1 미만 난수 (예 : 0.8214)
        let randomNum = Math.random(num) ; 
        console.log(randomNum);
        
    </script>
</body>
</html>
