<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Array 객체 </title>
</head>
<body>
    <script> 
        // Array 여러 데이터를 순서대로 관리 
        const arr = [1, 2, 3, 4]
        console.log(arr);
        // 1. length 속성 
        console.log(arr.length);
        // 2. push() : 배열 끝 요소를 추가하는 메서드 
        arr.push(8) ; 
        console.log(arr);
        // 3. por() : 배열 끝 요소를 제거하는 메서드 
        arr.pop();
        console.log(arr);
        // 4. shift() : 배열 첫 요소 제거 
        arr.shift() ; 
        console.log(arr);
        // 5 . unshift() : 배열 앞에 요소를 추가하는 메서드 
        arr.unshift(7) ; 
        console.log(arr);
        // 6. indexOf() : 요소 위치 반환 ( index 번호 )
        console.log(arr.indexOf(3));
        console.log(arr.indexOf(7));
        // 7. slice() : 배열 일부 반환 
        // slice(시작 인덱스(포함) , 끝 인덱스 (미포함) )
        console.log(arr.slice(1, 4));
        // 8. splice() : 배열 요소를 추가 / 삭제 
        // splice(시작 인덱스 (여기서 부터) , 삭제 개수 , 추가할 값1 , 추가할 값2 , ... )
        console.log(arr);
        arr.splice( 1, 2, 44, 50, 100, 200 ) ; 
        console.log(arr);
        // 9. join() : 배열을 문자열로 변환 
        console.log(arr.join("******"));
        // 10. forEach() : 각 요소에 대해 함수 실행 
        arr.forEach( () => { 
            
        }) ; 
    </script>
</body>
</html>
