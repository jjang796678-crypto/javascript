<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>스위치 2</title>
  </head>
  <body>
    <script>
      let site = prompt(
        "다음 보기 중 이동할 사이트를 입력해주세요.",
        "구글, 네이버, 유튜브",
      );
      let url ; 
      switch (site) {
        case "구글":
          url = "www.google.com/";
          break;
        case "네이버":
          url = "www.naver.com/";
          break;
        case "유튜브":
          url = "www.youtube.com/";
          break;
        default:
          alert("보기에 없는 사이트 입니다.");
      }
      // console.log(url);
      if (url) {
        window.open(`https://${url}`, "_self");
      }
    </script>
  </body>
</html>
