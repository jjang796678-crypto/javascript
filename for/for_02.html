<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> for 2 </title>
</head>
<body>
    <ul class="list"> 
        <!-- js 출력 -->
        
    </ul>
    <script> 
        const products = ["사과" , "바나나" , "포도" , "딸기"]
        const proList = document.querySelector(".list")
        for(let i = 0 ; i < products.length ; i++) {
            // console.log(i);
            // console.log(products[3]);
            proList.innerHTML += `<li> ${products[i]} </li>`
        }
    </script>
</body>
</html>
