<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dom 4 </title>
    <style> 
        #cover2{
            /* width: 300px; */
            border-radius: 50%;
            border: 3px solid red;
        }
    </style>
</head>
<body>
    <img src="images/easys-1.jpg" alt="이미지" id="cover">
    <script> 
        const cover = document.getElementById("cover");
        // console.log(cover);
        // console.log(cover.src);
        // console.log(cover.alt);
        cover.addEventListener("mouseover" , (event)=>{
            console.log(event.target);
            
            cover.src = "images/easys-2.jpg"
            // console.log(cover);
            cover.id = "cover2"
        });
        cover.addEventListener("mouseout" , ()=>{
            cover.src = "images/easys-1.jpg" 
            // console.log(cover);
            cover.id = "cover1";
        });
    </script>
</body>
</html>
