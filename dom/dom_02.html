<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Dom 2 </title>
</head>
<body>
    <!-- 웹요소의 내용 수정  -->
    <button onclick="innerTxt()"> innerText 로 표시하기</button>
    <button onclick="innerHm()"> innerHtml 로 표시하기</button>
    <h1> 현재 시각 : </h1>
    <div id="current"> 
        <!-- js 출력  -->
        <strong> 시간 </strong>
    </div>
    <script> 
        // const current = document.querySelector("#current") ; 
        const current = document.getElementById("current") ; 
        // 요소명.innerText = 내용 
        // 요소명.innerHTML = 내용
        const now = new Date()
        console.log(now);
        // innerTxt() 함수 
        function innerTxt(){ 
            // 실행코드
            // console.log("확인");
            current.innerText = now 
        }
        function innerHm(){
            // current.innerHTML = now 
            current.innerHTML = ` <strong> ${now} </strong> ` ; 
        }
        // const innerTxt = document.querySelector() ; 
        // const innerHm = document.querySelector() ; 
    </script>
</body>
</html>
