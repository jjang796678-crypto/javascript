<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> dom - 요소생성 </title>
</head>
<body>
    <div id="container"> 
        <h1> 웹 프로그래밍</h1>
        <!-- p태그 생성  -->
    </div>
    <div class="notice"> 
        <!-- span 안에 글자 안녕하세요  -->
        <!-- <span> 안녕하세요 </span> -->
    </div>

    <script> 
        // p태그 생성 
        // createElement() 요소 생성 메서드 
        const newP = document.createElement("p");
        console.log(newP);
        // createTextNode() 글자 요소 생성 메서드 
        const txtNode = document.createTextNode(
            "don은 document abject model의 줄임말이다 "
        ); 
        console.log(txtNode);
        // p태그에 글자를 넣는다 
        //  appendChild() 자식 요소를 더하는 메서드 
        newP.appendChild(txtNode);
        console.log(newP);
        // container 영역 안에 p 태그 연결 
        document.querySelector("#container").appendChild(newP);
        // span 태그 생성 글자 안녕하세요 생성 
        // notice 안에 span 태그 추가 
    </script>
</body>
</html>
