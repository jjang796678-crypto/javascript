<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> fetch 01 </title>
</head>
<body>
    <div class="display"> 
        <!-- js 출력  -->
        
    </div>
    <script> 
        // fetch()
        // 일반적으로 서버에서 데이터를 가져올 때 사용, 
        //  api 요청이나 로컬 json 파일 읽는데도 활용 
        // 기본형식 
        // then(Response) : 서버가 보내준 응답 
        // then(data) : 변환이 끝난 실제 데이터를 화면에 출력 하는 공간 
        // catch() : 요청이나 데이터 처리 과정에서 오류가 발생했을 경우 처리하는 메서드 
        // fetch('주소').then(Response).then(data).catch(Error);
        //   status: 200 - http 주소 상태 코드 
        // 200 : 서버가 요청을 정상적으로 처리 
        // 300 : 요청한 주소에서 다른 주소로 이동해야 하거나 이동이 발생 했음 
        // 400 : 요청에 문제가 있다 
        // 500 : 서버에 문제가 발생 
        fetch("data.json")
        .then((Response)=>{
            // console.log(Response);
            return Response.json() // 응답 데이터를 자바 스크립트에서 사용할 수 있게 변환 
        })
        .then((data)=>{
            // console.log(data);
            const displayEl = document.querySelector(".display");
            displayEl.innerHTML = 
            `
            <p> 이름 : ${data.name} </p>
            <p> 나이 : ${data.age} </p>
            <p> 도시 : ${data.city} </p>
            `;
        })
        .catch((error) => {
            console.log("오류발생:" , error);
        });
    </script>
</body>
</html>
