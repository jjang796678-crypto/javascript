<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> fetch 02 </title>
</head>
<body>
    <div id="result"> 
        <!-- js 출력 -->

    </div>
    <script> 
        fetch("product.json").then((res)=>{
            console.log(res);
            return res.json();
        })
        // data 칸에 어떤 단어가 들어가도 상관없음 
        .then((data)=>{
            // console.log(data);
            // const htmlEl = data.map().join("");
            // result.innerHTML = htmlEl
            const result = document.querySelector("#result");
            result.innerHTML = data
            .map((item)=>{
                return `
            <div class="card"> 
            <h3> 상품명 : ${item.name} </h3>
            <p> 가격 : ${item.price} </p>
            </div>
            `;
            })
            .join("");
        })
        .catch((error)=>{
            console.log(error);
            
        });
    </script>
</body>
</html>
