<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #result{
        max-width: 1000px;
        flex-wrap: wrap;
        display: flex;
        gap: 20px
        ;
        background-color: #8b8b8b;
        }
        .card{
            flex: 1;
            background-color: antiquewhite;
            padding: 20px;
        }
    </style>
</head>
<body>
    <h1> 사용자 데이터 가져오기 </h1>
    <button class="loadBtn"> 데이터 가져오기 </button>
    <div id="result"> 
        <!-- js 출력  -->
        <div class="card">
            <h2> 이름 </h2>
            <p> <strong> 아이디 : </strong> </p>
        </div>
    </div>
    <script> 
        const loadBtn = document.querySelector(".loadBtn");
        const result = document.querySelector("#result");
        loadBtn.addEventListener("click" , () => {
            // console.log("click");
            fetch("https://jsonplaceholder.typicode.com/users")
            .then((res) => {
                // console.log(res);
                return res.json();
            })
            .then((data)=>{
                // console.log(data);
                result.innerHTML = data.map((user)=>{
                    console.log(user);
                    
                }).join("")
            })
            .catch((error) => {
                console.log(error);
                
            });
        });
    </script>
</body>
</html>
