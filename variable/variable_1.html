<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> 변수 1 </title>
</head>
<body>

    <script> 
        // 변수 공부 
        // 변수 : 데이터를 담는 상자 
        // 변수 선언과 할당이 있다 
        let name = "장영우"
        console.log(name);
        // name 변수에 재할당 
        // let name = "김영우" ; 
        name = "장우영" ; 
        console.log(name);
        const age = 20 ; 
        // const age = 40 ;
        console.log(age);
        // age = 30 ; 
        let username = prompt("이름을 입력하세요" , "ㅁㅁㅁ") ; 
        console.log(username) ; 
        document.write(` <h1> 이름 : ${username} </h1> <p> 나이 : ${age} </p> `) ; 
        
    </script>
</body>
</html>
